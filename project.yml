name: atv-kbd
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.atv-kbd
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Debug-AppStore: debug
  Release: release
  Release-AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: R892A93W42
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  ItsytvCore:
    path: ../itsytv-core

schemes:
  atv-kbd:
    build:
      targets:
        atv-kbd: all
        atv-kbdTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - atv-kbdTests
    archive:
      config: Release
  atv-kbd-appstore:
    build:
      targets:
        atv-kbd: all
        atv-kbdTests: [test]
    run:
      config: Debug-AppStore
    test:
      config: Debug-AppStore
      targets:
        - atv-kbdTests
    archive:
      config: Release-AppStore

targets:
  atv-kbd:
    type: application
    platform: macOS
    sources:
      - path: atv-kbd
        excludes:
          - "**/*.proto"
          - atv-kbd.entitlements
          - atv-kbd-direct.entitlements
    settings:
      base:
        INFOPLIST_FILE: atv-kbd/Info.plist
        CODE_SIGN_ENTITLEMENTS: atv-kbd/atv-kbd.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.atv-kbd.app
        PRODUCT_NAME: ATV KBD
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.9.1"
        CURRENT_PROJECT_VERSION: "19101"
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: atv-kbd/atv-kbd-direct.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: atv-kbd/atv-kbd-direct.entitlements
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    dependencies:
      - package: ItsytvCore
  # Logic tests without a host app: the menu bar app would start scanning for Apple TVs (and ask
  # for local network access) on every test run. The decision logic in atv-kbd/Onboarding and
  # atv-kbd/Remote and the remote's keyboard shortcuts in atv-kbd/Shortcuts are plain Swift and
  # AppKit, compiled straight into the test bundle.
  atv-kbdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: atv-kbdTests
      - path: atv-kbd/Onboarding
      - path: atv-kbd/Remote
      - path: atv-kbd/Shortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atv-kbd.app.tests
        GENERATE_INFOPLIST_FILE: true
